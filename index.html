<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="historico">
      <h2>HISTÓRICO</h2>

      <div id="listaHistorico"></div>
    </div>

    <div class="calculadora">
      <div class="nocturneMode">
        <button>🌙</button>
      </div>
      <div class="visor">
        <h1>Calculadora</h1>
        <input type="text" placeholder=">_" id="visor" />
      </div>

      <div class="teclado" id="teclado">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>/</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>*</button>
        <button>1</button>
        <button>2</button>

        <button>3</button>
        <button>-</button>
        <button>0</button>
        <button>%</button>
        <button>←</button>

        <button>+</button>
        <button>C</button>
        <button>=</button>
      </div>
    </div>
    <script src="scrypt.js"></script>
  </body>
</html>
